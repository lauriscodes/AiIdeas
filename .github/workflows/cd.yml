name: Continuous Deployment
run-name: Deploy ${{ github.event.workflow_run.head_sha }} to Render

on:
  workflow_run:
    workflows: [Continuous Integration]
    branches: [main]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: render-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Tested Commit to Render
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    env:
      RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
    steps:
      - name: Validate Render configuration
        shell: bash
        run: |
          if [[ -z "$RENDER_SERVICE_ID" || -z "$RENDER_API_KEY" ]]; then
            echo "::error::Set the RENDER_SERVICE_ID and RENDER_API_KEY repository secrets."
            exit 1
          fi
      - name: Deploy the commit that passed CI
        uses: JorgeLNJunior/render-deploy@v1.5.0
        with:
          service_id: ${{ secrets.RENDER_SERVICE_ID }}
          api_key: ${{ secrets.RENDER_API_KEY }}
          github_token: ${{ github.token }}
          ref: ${{ github.event.workflow_run.head_sha }}
          wait_deploy: true
